name: Enrich citation data

on:
  schedule:
    # Weekly, Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch citation counts from OpenAlex
        env:
          # Optional: set repo variable OPENALEX_MAILTO to your contact email
          # for OpenAlex's "polite pool". Falls back to a generic address.
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: node scripts/enrich-citations.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Refresh citation data from OpenAlex"
            git push
          else
            echo "No citation changes."
          fi
