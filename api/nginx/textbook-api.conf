# nginx vhost for the Textbook API. On the server this block lives in the
# nginx container's config (appended to /home/ubuntu/nginx/webgrid.conf, which
# is already mounted into the container). It proxies the public HTTPS subdomain
# to the textbook-api container on the docker bridge. It does NOT touch the
# existing webgrid.online server blocks.

server {
    listen 80;
    server_name textbook-api.webgrid.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name textbook-api.webgrid.online;

    ssl_certificate     /etc/letsencrypt/live/textbook-api.webgrid.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/textbook-api.webgrid.online/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
